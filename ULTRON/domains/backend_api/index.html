<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-8 flex justify-center">
    <div class="w-full max-w-md bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
        <h1 class="text-xl font-bold mb-4 text-indigo-400">ULTRON Task Manager</h1>
        <div class="flex gap-2 mb-4">
            <input type="text" id="task-input" placeholder="New task..." class="flex-1 bg-slate-950 border border-slate-800 px-3 py-2 rounded-xl text-sm">
            <button id="btn-add-task" onclick="addTask()" class="bg-indigo-600 px-4 py-2 rounded-xl text-sm font-bold">Add</button>
        </div>
        <ul id="task-list" class="space-y-2"></ul>
    </div>
    <script>
        let tasks = [];
        function addTask() {
            let val = document.getElementById('task-input').value.trim();
            if (val) { tasks.push(val); document.getElementById('task-input').value = ''; render(); }
        }
        function render() {
            let el = document.getElementById('task-list');
            el.innerHTML = tasks.map(t => `<li class="p-3 bg-slate-950 rounded-xl text-sm flex justify-between border border-slate-800"><span>${t}</span></li>`).join('');
        }
</body>
</html>
