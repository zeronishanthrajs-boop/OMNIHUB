name: Hypothesis Engine & Evidence Linker (Phase 6)

on:
  schedule:
    - cron: '0 6 * * 3'   # Every Wednesday at 06:00 UTC (hypothesis_engine)
    - cron: '0 7 * * *'   # Every day at 07:00 UTC (evidence_linker)
  workflow_dispatch:      # Allow manual trigger

jobs:
  hypothesis_engine:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hypothesis Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/hypothesis_engine.py

  evidence_linker:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Evidence Linker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/evidence_linker.py
